<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RIVERBANK BETA 0.5 - String Perspective Drafting Engine</title>
  <style>
    :root {
      --bg: #0c1017; /* ธีมกระดานชนวน/กระดานดำคลาสสิก */
      --panel: #131c28;
      --panel-border: #243044;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --theme: #eab308; /* สีทองเหลืองทองแดง (Brass/Copper String) */
      --radius: 8px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Courier New", monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding-bottom: 30px;
      overflow-x: hidden;
    }

    header {
      width: 100%;
      max-width: 540px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--panel-border);
      background: rgba(19, 28, 40, 0.95);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .badge-uni {
      font-size: 9px;
      padding: 3px 6px;
      border-radius: 4px;
      border: 1px solid var(--theme);
      color: var(--theme);
      font-weight: 900;
      letter-spacing: 0.8px;
      font-family: monospace;
    }
    
    .lang-toggle-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--panel-border);
      color: var(--theme);
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 900;
      font-family: monospace;
      cursor: pointer;
    }

    .app-container {
      width: 100%;
      max-width: 540px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* โมดูลสลับบทเรียน */
    .module-nav {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }
    .mod-btn {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      color: var(--muted);
      padding: 6px 2px;
      border-radius: 6px;
      font-size: 8px;
      font-weight: bold;
      font-family: monospace;
      cursor: pointer;
      text-align: center;
      transition: 0.2s;
    }
    .mod-btn.active {
      border-color: var(--theme);
      color: #fff;
      background: rgba(234, 179, 8, 0.15);
      box-shadow: 0 0 10px rgba(234, 179, 8, 0.25);
    }

    /* Viewport กระดานดำสไตล์ String Perspective */
    .cad-viewport {
      width: 100%;
      aspect-ratio: 1.618 / 1;
      background: #080c10;
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(234, 179, 8, 0.05);
    }
    svg#cadStage {
      width: 100%;
      height: 100%;
      display: block;
    }

    .math-hud-overlay {
      position: absolute;
      top: 6px;
      left: 6px;
      right: 6px;
      display: flex;
      justify-content: flex-start;
      pointer-events: none;
      z-index: 5;
    }
    .formula-card {
      background: rgba(12, 16, 23, 0.95);
      border: 1px solid var(--panel-border);
      border-left: 3px solid var(--theme);
      border-radius: 4px;
      padding: 4px 6px;
      font-size: 8.5px;
      font-family: "Courier New", Courier, monospace;
      max-width: 95%;
    }
    .formula-title {
      font-size: 6.5px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 1px;
    }
    .formula-eq {
      color: #fff;
      font-weight: bold;
      font-size: 8.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .formula-eq span.hl {
      color: var(--theme);
      font-weight: 900;
    }

    /* Contextual Radial Menu (หมุดสั่งการสไตล์ CAD) */
    .radial-menu {
      position: absolute;
      width: 130px;
      height: 130px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 20;
      display: none;
    }
    .radial-menu.active {
      pointer-events: auto;
      display: block;
      animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    @keyframes popIn {
      0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }
    .radial-btn {
      position: absolute;
      width: 40px;
      height: 40px;
      background: rgba(19, 28, 40, 0.95);
      border: 1.5px solid var(--theme);
      color: #fff;
      border-radius: 50%;
      font-size: 8.5px;
      font-weight: bold;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(234, 179, 8, 0.3);
      transition: 0.2s;
    }
    .radial-btn:hover {
      background: var(--theme);
      color: #0c1017;
      transform: scale(1.1);
    }
    .rb-top { top: 0; left: 45px; }
    .rb-left { top: 45px; left: 0; }
    .rb-right { top: 45px; right: 0; }
    .rb-bottom { bottom: 0; left: 45px; }

    /* แผงปุ่มแอคชัน */
    .action-panel {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
    }
    .action-btn {
      height: 38px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      color: var(--text);
      border-radius: var(--radius);
      font-size: 9.5px;
      font-weight: bold;
      font-family: monospace;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .action-btn:hover {
      border-color: var(--theme);
      background: rgba(234, 179, 8, 0.1);
    }
    .action-btn.primary {
      background: rgba(234, 179, 8, 0.2);
      border-color: var(--theme);
      color: var(--theme);
    }

    .control-box {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .control-info {
      display: flex;
      justify-content: space-between;
      font-size: 10.5px;
      color: var(--muted);
      font-family: monospace;
    }
    .control-info span.val {
      color: var(--theme);
      font-weight: bold;
    }

    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      height: 22px;
      background: transparent;
      margin: 0;
      cursor: pointer;
    }
    input[type=range]:focus { outline: none; }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 5px;
      background: #080c10;
      border: 1px solid var(--panel-border);
      border-radius: 3px;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 18px;
      width: 18px;
      border-radius: 50%;
      background: var(--theme);
      box-shadow: 0 0 8px var(--theme);
      cursor: pointer;
      margin-top: -7px;
      border: 2px solid #fff;
    }

    .pedagogy-banner {
      background: rgba(234, 179, 8, 0.05);
      border: 1px dashed rgba(234, 179, 8, 0.35);
      border-radius: var(--radius);
      padding: 8px 12px;
      font-size: 10px;
      color: #fef08a;
      font-family: monospace;
      line-height: 1.35;
    }
    .pedagogy-banner strong {
      color: var(--theme);
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <span class="badge-uni">RIVERBANK 0.5</span>
      <strong style="font-size: 11px;">String Drafting Slate</strong>
    </div>
    <button class="lang-toggle-btn" onclick="toggleLanguage()">🌐 TH | EN</button>
  </header>

  <div class="app-container">
    
    <!-- Navigation โมดูลบทเรียน -->
    <div class="module-nav">
      <button class="mod-btn active" id="navList" onclick="switchModule('list')">🔗 List</button>
      <button class="mod-btn" id="navStack" onclick="switchModule('stack')">📦 Stack</button>
      <button class="mod-btn" id="navTree" onclick="switchModule('tree')">🌳 Tree</button>
      <button class="mod-btn" id="navSort" onclick="switchModule('sort')">📊 Sort</button>
    </div>

    <!-- Viewport กระดานดำคลาสสิก -->
    <div class="cad-viewport" id="viewport">
      <div class="math-hud-overlay">
        <div class="formula-card">
          <div class="formula-title" id="hudTitle">Active Module</div>
          <div class="formula-eq" id="hudStatus">Status: String Perspective Active</div>
        </div>
      </div>

      <svg id="cadStage" viewBox="0 0 600 370" onclick="handleBgClick(event)">
        <defs>
          <!-- เส้นเชือกทองเหลืองและหัวหมุดพอยต์ -->
          <marker id="pinArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#eab308"/>
          </marker>
        </defs>
        <!-- เส้นตารางกระดานดำจาง ๆ (Perspective Drafting Grid) -->
        <g stroke="#1a2332" stroke-width="0.5">
          <line x1="0" y1="185" x2="600" y2="185" stroke-dasharray="4 4"/>
          <line x1="300" y1="0" x2="300" y2="370" stroke-dasharray="4 4"/>
        </g>
        <g id="stageContent"></g>
      </svg>

      <!-- Contextual Radial Menu (หัวหมุด CAD) -->
      <div class="radial-menu" id="radialMenu">
        <div class="radial-btn rb-top" onclick="radialAction('insert')"><span>📌</span><span>Ins</span></div>
        <div class="radial-btn rb-left" onclick="radialAction('inspect')"><span>🔍</span><span>Info</span></div>
        <div class="radial-btn rb-right" onclick="radialAction('delete')"><span>✂️</span><span>Del</span></div>
        <div class="radial-btn rb-bottom" onclick="radialAction('close')"><span>❌</span><span>X</span></div>
      </div>
    </div>

    <!-- แผงปุ่มแอคชันอัจฉริยะ -->
    <div class="action-panel" id="actionPanel">
      <button class="action-btn primary" id="btnPrimary" onclick="doPrimaryAction()">📌 Insert Pin</button>
      <button class="action-btn" id="btnSecondary" onclick="doSecondaryAction()">✂️ Remove Pin</button>
      <button class="action-btn" onclick="doResetAction()">🔄 Reset</button>
    </div>

    <!-- แผงควบคุมพารามิเตอร์ N -->
    <div class="control-box">
      <div class="control-info">
        <span id="controlLabel">พารามิเตอร์จำนวนหมุด (N)</span>
        <span class="val" id="controlVal">5 Items</span>
      </div>
      <input type="range" id="mainSlider" min="3" max="7" value="5" oninput="onSliderChange(this.value)">
    </div>

    <div class="pedagogy-banner" id="bannerText">
      <strong>Riverbank Beta 0.5:</strong> ผสานสถาปัตยกรรมโครงสร้างข้อมูลเข้ากับเทคนิค String Perspective และกระดานดำสถาปนิกคลาสสิกอย่างไร้รอยต่อ
    </div>

  </div>

  <script>
    let lang = 'th';
    let currentModule = 'list';
    let dataLength = 5;
    let listNodes = [10, 20, 30, 40, 50];
    let selectedIdx = null;
    let sortArray = [45, 12, 78, 23, 56];

    function toggleLanguage() {
      lang = (lang === 'th') ? 'en' : 'th';
      document.querySelector('.lang-toggle-btn').innerText = lang === 'th' ? '🌐 TH | EN' : '🌐 EN | TH';
      updateButtonLabels();
      renderStage();
    }

    function updateButtonLabels() {
      if (currentModule === 'list') {
        document.getElementById('btnPrimary').innerHTML = lang === 'th' ? '📌 ปักหมุดแทรก' : '📌 Insert Pin';
        document.getElementById('btnSecondary').innerHTML = lang === 'th' ? '✂️ ปลดหมุดออก' : '✂️ Remove Pin';
        document.getElementById('hudStatus').innerHTML = lang === 'th' ? 'สถานะ: แตะหมุดเพื่อเปิด String Radial Menu' : 'Status: Tap Pin for String Radial Menu';
      } else if (currentModule === 'stack') {
        document.getElementById('btnPrimary').innerHTML = lang === 'th' ? '📥 วางซ้อน (Push)' : '📥 Push';
        document.getElementById('btnSecondary').innerHTML = lang === 'th' ? '📤 ดึงออก (Pop)' : '📤 Pop';
        document.getElementById('hudStatus').innerHTML = lang === 'th' ? 'สถานะ: โครงสร้างซ้อนทับแนวตั้ง (LIFO)' : 'Status: Vertical Stack Hierarchy (LIFO)';
      } else if (currentModule === 'tree') {
        document.getElementById('btnPrimary').innerHTML = lang === 'th' ? '🌿 แตกกิ่ง' : '🌿 Add Branch';
        document.getElementById('btnSecondary').innerHTML = lang === 'th' ? '🍂 ตัดกิ่ง' : '🍂 Prune';
        document.getElementById('hudStatus').innerHTML = lang === 'th' ? 'สถานะ: โครงสร้างกิ่งก้านสาขา BST' : 'Status: Binary Search Tree Network';
      } else if (currentModule === 'sort') {
        document.getElementById('btnPrimary').innerHTML = lang === 'th' ? '⚡ เรียงลำดับเชือก' : '⚡ Sort Asc';
        document.getElementById('btnSecondary').innerHTML = lang === 'th' ? '🔀 สลับตำแหน่ง' : '🔀 Shuffle';
        document.getElementById('hudStatus').innerHTML = lang === 'th' ? 'สถานะ: เปรียบเทียบความสูงระดับเสา' : 'Status: Height Equalizer Sorting';
      }
    }

    function switchModule(mod) {
      currentModule = mod;
      ['List', 'Stack', 'Tree', 'Sort'].forEach(m => {
        document.getElementById('nav' + m).classList.toggle('active', m.toLowerCase() === mod);
      });
      closeRadialMenu();
      
      const slider = document.getElementById('mainSlider');
      if(mod === 'sort') {
        slider.min = 4; slider.max = 6; slider.value = 5;
        dataLength = 5;
        sortArray = [45, 12, 78, 23, 56];
      } else {
        slider.min = 3; slider.max = 7; slider.value = 5;
        dataLength = 5;
        listNodes = [10, 20, 30, 40, 50];
      }
      updateButtonLabels();
      renderStage();
    }

    function onSliderChange(val) {
      dataLength = parseInt(val);
      document.getElementById('controlVal').innerText = `${dataLength} Items`;
      if(currentModule === 'list' || currentModule === 'tree' || currentModule === 'stack') {
        listNodes = [];
        for(let i=0; i<dataLength; i++) listNodes.push((i+1)*10);
      } else if(currentModule === 'sort') {
        sortArray = [];
        for(let i=0; i<dataLength; i++) sortArray.push(Math.floor(Math.random()*80) + 10);
      }
      closeRadialMenu();
      renderStage();
    }

    function renderStage() {
      const container = document.getElementById('stageContent');
      let svg = '';
      if (currentModule === 'list') svg = renderLinkedListSVG();
      else if (currentModule === 'stack') svg = renderStackQueueSVG();
      else if (currentModule === 'tree') svg = renderBinaryTreeSVG();
      else if (currentModule === 'sort') svg = renderSortingSVG();
      container.innerHTML = svg;
    }

    function renderLinkedListSVG() {
      const cy = 210;
      let svg = `<text x="300" y="28" fill="#eab308" font-size="9.5" font-weight="bold" font-family="monospace" text-anchor="middle">STRING PERSPECTIVE: LINKED LIST</text>`;
      
      const nodeW = Math.max(32, Math.min(52, (480 / listNodes.length) - 8));
      const nodeH = nodeW * 0.65;
      const spacing = Math.max(12, Math.min(20, 100 / listNodes.length));
      const totalSpan = listNodes.length * nodeW + (listNodes.length - 1) * spacing;
      const startX = (600 - totalSpan) / 2;

      for (let i = 0; i < listNodes.length; i++) {
        let nx = startX + (i * (nodeW + spacing));
        let ny = cy;

        // วาดเส้นเชือก (String Line) โยงขึงตึงระหว่างโหนด
        if (i < listNodes.length - 1) {
          let nextNx = startX + ((i + 1) * (nodeW + spacing));
          const midX = (nx + nodeW + nextNx) / 2;
          svg += `<path d="M ${nx + nodeW} ${ny} Q ${midX} ${ny + 22} ${nextNx} ${ny}" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="3 3" marker-end="url(#pinArrow)"/>`;
        }

        let isSelected = (selectedIdx === i);
        let strokeCol = isSelected ? "#f59e0b" : "#eab308";
        let fillCol = isSelected ? "rgba(245, 158, 11, 0.25)" : "rgba(19, 28, 40, 0.85)";
        let pxX = nx + nodeW/2, pxY = ny;

        svg += `
          <g transform="translate(${nx}, ${ny - nodeH/2})" style="cursor: pointer;" onclick="onListNodeClick(event, ${i}, ${pxX}, ${pxY})">
            <rect width="${nodeW}" height="${nodeH}" rx="4" fill="${fillCol}" stroke="${strokeCol}" stroke-width="${isSelected?'2.5':'1.8'}"/>
            <text x="${nodeW/2}" y="${nodeH*0.38}" fill="${strokeCol}" font-size="${Math.max(6, nodeW*0.16)}" font-family="monospace" text-anchor="middle">PIN ${i}</text>
            <text x="${nodeW/2}" y="${nodeH*0.78}" fill="#fff" font-size="${Math.max(7, nodeW*0.22)}" font-weight="bold" font-family="monospace" text-anchor="middle">[${listNodes[i]}|•]</text>
          </g>
        `;
      }
      return svg;
    }

    function renderStackQueueSVG() {
      let svg = `<text x="300" y="28" fill="#eab308" font-size="9.5" font-weight="bold" font-family="monospace" text-anchor="middle">STRING PERSPECTIVE: VERTICAL STACK</text>`;
      
      const boxW = 110, boxH = 34;
      const startX = 245, startY = 295;

      for (let i = 0; i < listNodes.length; i++) {
        let by = startY - (i * (boxH + 5));
        let isTop = (i === listNodes.length - 1);
        let strokeCol = isTop ? "#f59e0b" : "#eab308";
        let fillCol = isTop ? "rgba(245, 158, 11, 0.25)" : "rgba(19, 28, 40, 0.85)";

        svg += `
          <g transform="translate(${startX}, ${by})">
            <rect width="${boxW}" height="${boxH}" rx="4" fill="${fillCol}" stroke="${strokeCol}" stroke-width="1.8"/>
            <text x="${boxW/2}" y="${boxH*0.6}" fill="#fff" font-size="10.5" font-weight="bold" font-family="monospace" text-anchor="middle">BLOCK ${listNodes[i]}</text>
          </g>
        `;
        if(isTop) {
          svg += `<text x="${startX + boxW + 12}" y="${by + boxH/2 + 3}" fill="#f59e0b" font-size="8.5" font-weight="bold" font-family="monospace">← PIN TOP</text>`;
        }
      }
      return svg;
    }

    function renderBinaryTreeSVG() {
      let svg = `<text x="300" y="28" fill="#eab308" font-size="9.5" font-weight="bold" font-family="monospace" text-anchor="middle">STRING PERSPECTIVE: BINARY TREE</text>`;
      
      const nodes = [
        {val: 50, x: 300, y: 75},
        {val: 25, x: 180, y: 155}, {val: 75, x: 420, y: 155},
        {val: 12, x: 110, y: 235}, {val: 35, x: 250, y: 235}, {val: 65, x: 350, y: 235}, {val: 90, x: 490, y: 235}
      ];
      const r = 18;
      const edges = [[0,1],[0,2],[1,3],[1,4],[2,5],[2,6]];
      edges.forEach(([p, c]) => {
        svg += `<line x1="${nodes[p].x}" y1="${nodes[p].y}" x2="${nodes[c].x}" y2="${nodes[c].y}" stroke="#d97706" stroke-width="1.8" stroke-dasharray="3 3"/>`;
      });
      nodes.forEach((n) => {
        svg += `
          <g transform="translate(${n.x}, ${n.y})">
            <circle r="${r}" fill="rgba(19, 28, 40, 0.9)" stroke="#eab308" stroke-width="2"/>
            <text x="0" y="4" fill="#fff" font-size="9.5" font-weight="bold" font-family="monospace" text-anchor="middle">${n.val}</text>
          </g>
        `;
      });
      return svg;
    }

    function renderSortingSVG() {
      let svg = `<text x="300" y="28" fill="#eab308" font-size="9.5" font-weight="bold" font-family="monospace" text-anchor="middle">STRING PERSPECTIVE: SORTING EQUALIZER</text>`;
      
      const maxVal = 90;
      const barW = 40;
      const spacing = 18;
      const totalW = sortArray.length * barW + (sortArray.length - 1) * spacing;
      const startX = (600 - totalW) / 2;
      const baseY = 285;

      sortArray.forEach((val) => {
        let barH = (val / maxVal) * 170;
        let bx = startX + sortArray.indexOf(val) * (barW + spacing);
        let by = baseY - barH;

        svg += `
          <g transform="translate(${bx}, ${by})">
            <rect width="${barW}" height="${barH}" rx="4" fill="rgba(234, 179, 8, 0.15)" stroke="#eab308" stroke-width="1.8"/>
            <text x="${barW/2}" y="-6" fill="#eab308" font-size="9.5" font-weight="bold" font-family="monospace" text-anchor="middle">${val}</text>
          </g>
        `;
      });
      return svg;
    }

    function onListNodeClick(event, idx, svgX, svgY) {
      if(currentModule !== 'list') return;
      event.stopPropagation();
      selectedIdx = idx;
      renderStage();

      const viewport = document.getElementById('viewport');
      const pxX = (svgX / 600) * viewport.clientWidth;
      const pxY = (svgY / 370) * viewport.clientHeight;

      const menu = document.getElementById('radialMenu');
      menu.style.left = `${pxX}px`;
      menu.style.top = `${pxY}px`;
      menu.classList.add('active');
    }

    function handleBgClick(event) {
      closeRadialMenu();
    }

    function closeRadialMenu() {
      selectedIdx = null;
      document.getElementById('radialMenu').classList.remove('active');
      renderStage();
    }

    function radialAction(action) {
      if(selectedIdx === null) return;
      if(action === 'insert') {
        let newVal = listNodes[selectedIdx] + 5;
        listNodes.splice(selectedIdx + 1, 0, newVal);
      } else if(action === 'delete') {
        if(listNodes.length > 3) listNodes.splice(selectedIdx, 1);
      } else if(action === 'inspect') {
        alert(`Pin N${selectedIdx} | Value: ${listNodes[selectedIdx]}`);
      }
      closeRadialMenu();
    }

    function doPrimaryAction() {
      if(currentModule === 'list') {
        listNodes.push((listNodes.length + 1) * 10);
      } else if(currentModule === 'stack') {
        listNodes.push(Math.floor(Math.random() * 90) + 10);
      } else if(currentModule === 'tree') {
        listNodes.push(Math.floor(Math.random() * 90) + 10);
      } else if(currentModule === 'sort') {
        sortArray.sort((a,b) => a - b);
      }
      renderStage();
    }

    function doSecondaryAction() {
      if(currentModule === 'list' && listNodes.length > 3) {
        listNodes.pop();
      } else if(currentModule === 'stack' && listNodes.length > 1) {
        listNodes.pop();
      } else if(currentModule === 'sort') {
        sortArray = sortArray.sort(() => Math.random() - 0.5);
      }
      renderStage();
    }

    function doResetAction() {
      switchModule(currentModule);
    }

    window.addEventListener('DOMContentLoaded', () => {
      updateButtonLabels();
      renderStage();
    });
  </script>
</body>
</html>
